services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rentapart-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - rentapart-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  rentapart-data:
